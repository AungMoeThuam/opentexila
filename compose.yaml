name: opentexila-frontend

services:
  frontend:
    build:
      context: .
      target: production
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:8080'
    environment:
      API_UPSTREAM: ${FRONTEND_API_UPSTREAM:-http://host.docker.internal:3000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  frontend-dev:
    profiles: [development]
    build:
      context: .
      target: development
    ports:
      - '127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173'
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_ENABLE_MOCK_AUTH: ${FRONTEND_MOCK_AUTH:-true}
      API_PROXY_TARGET: ${FRONTEND_API_UPSTREAM:-http://host.docker.internal:3000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.js:/app/vite.config.js:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:5173/']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
