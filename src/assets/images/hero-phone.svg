  <circle cx="42" cy="125" r="20" fill="#fdecec" />
  <path d="M42 135s-9-8.5-9-15a9 9 0 0 1 18 0c0 6.5-9 15-9 15Z" stroke="#d7141a" stroke-width="2.5" stroke-linejoin="round" />
