  <text x="74" y="121" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e293b">Inside the area</text>
  <text x="74" y="141" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#5c6b7d">42 m from the pin</text>

