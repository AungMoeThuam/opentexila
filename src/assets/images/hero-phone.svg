  <circle cx="222" cy="289" r="4.5" fill="#176541" />
  <text x="234" y="292.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#176541">Inside the area · 42 m</text>

