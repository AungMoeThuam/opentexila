  <text x="208" y="112" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="700" letter-spacing="1" fill="#d7141a">STUDENT ATTENDANCE</text>
  <text x="208" y="134" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#1e293b">Class check-in</text>

