  <text x="216" y="184" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Interface Design</text>
  <text x="216" y="199" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">and Development</text>
