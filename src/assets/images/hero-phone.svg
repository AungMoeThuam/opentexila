  <text x="400" y="358" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1e293b">Checked in</text>
  <text x="400" y="382" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#176541">Present · 09:02</text>
