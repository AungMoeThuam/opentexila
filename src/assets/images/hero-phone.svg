  <rect x="185" y="24" width="190" height="412" rx="38" stroke="#3a4f72" stroke-width="2" />
  <rect x="194" y="33" width="172" height="394" rx="30" fill="#f5f7fa" />
  <rect x="250" y="41" width="60" height="14" rx="7" fill="#0a1628" />

