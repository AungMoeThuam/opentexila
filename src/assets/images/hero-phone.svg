  <text x="246" y="222" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#17489e">In progress</text>
  <text x="216" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#5c6b7d">Late after 09:15</text>
  <text x="216" y="256" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#5c6b7d">Demo room 1</text>

